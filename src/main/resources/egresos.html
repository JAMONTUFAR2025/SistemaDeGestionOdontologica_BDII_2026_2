<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egresos y Gastos - SOE Odontología</title>
    <!-- Estilos locales -->
    <link href="application/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="application/assets/css/all.min.css" rel="stylesheet">
    <style>
        /* === ESTILOS GENERALES Y DE TABLA === */
        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('fondo-clinica.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #e9f0f5;
            min-height: 100vh;
        }

        .modal-backdrop.show {
            opacity: 0.35 !important;
            background-color: rgba(0, 0, 0, 0.4) !important;
        }

        .card-container {
            max-width: 950px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .table-custom {
            width: 100%;
            margin-bottom: 1rem;
            border-collapse: collapse;
        }

        .table-custom th {
            border-top: none;
            border-bottom: 1px solid #dee2e6;
            padding: 12px 15px;
            font-weight: bold;
            color: #000;
        }

        .table-custom td {
            border-bottom: 1px solid #eaeaea;
            padding: 15px;
            vertical-align: middle;
            color: #555;
        }

        .action-icons i {
            font-size: 1.2rem;
            cursor: pointer;
            margin-right: 15px;
        }

        .fa-edit {
            color: #0d6efd;
        }

        .fa-trash {
            color: #dc3545;
        }

        /* === ESTILOS DEL MODAL === */
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-header {
            background-color: #007bf0;
            color: white;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: none;
        }

        .btn-guardar {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 6px;
        }
        .btn-guardar:hover {
            background-color: #218838;
            color: white;
        }
        
        .section-title {
            color: #28a745;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 5px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container card-container">
        <a href="menu.html" class="text-decoration-none mb-3 d-inline-block fw-bold" style="color: #007bf0;">
            ← Volver al Menú Principal
        </a>

        <div>
            <h3 class="fw-bold text-start mb-4" style="color: #007bf0 !important;">
                <i class="fa-solid fa-wallet"></i> Control de Egresos y Gastos
            </h3>

            <!-- Buscador universal, filtro fechas y botón Agregar -->
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                <div class="d-flex flex-wrap align-items-end gap-2">
                    <div>
                        <label for="buscadorEgresos" class="form-label fw-bold text-dark mb-1" style="font-size:0.85rem;">Buscar:</label>
                        <input type="text" id="buscadorEgresos" class="form-control" style="width: 210px;"
                            placeholder="Descripción, comprobante...">
                    </div>
                    <div>
                        <label for="fechaDesdeEgresos" class="form-label fw-bold text-dark mb-1" style="font-size:0.85rem;">Desde:</label>
                        <input type="date" id="fechaDesdeEgresos" class="form-control" style="width: 150px;">
                    </div>
                    <div>
                        <label for="fechaHastaEgresos" class="form-label fw-bold text-dark mb-1" style="font-size:0.85rem;">Hasta:</label>
                        <input type="date" id="fechaHastaEgresos" class="form-control" style="width: 150px;">
                    </div>
                    <button class="btn btn-outline-secondary" onclick="limpiarFiltrosEgresos()" title="Limpiar filtros" style="height:38px;">
                        <i class="fas fa-times me-1"></i>Limpiar
                    </button>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="abrirModalEgreso(null)">
                        <i class="fas fa-plus"></i> Nuevo Egreso
                    </button>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table-custom text-center">
                    <thead>
                        <tr>
                            <th>N° Transacción</th>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>N° Comprobante</th>
                            <th>Monto (Lps)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEgresosBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRO/EDICION DE EGRESO -->
    <div class="modal fade" id="modalAgregarEgreso" tabindex="-1" data-bs-backdrop="false" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="tituloModal">
                        <i class="fa-solid fa-wallet"></i> Registrar Nuevo Egreso
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEgreso">
                        <input type="hidden" id="eg_id">
                        
                        <div class="section-title mt-0">Detalles de la Compra / Gasto</div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Fecha del Gasto:*</label>
                            <input type="date" id="eg_fecha" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción / Concepto:*</label>
                            <textarea id="eg_descripcion" class="form-control" rows="2" placeholder="Ej: Compra de insumos médicos" required></textarea>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Monto (Lps):*</label>
                                <input type="number" id="eg_monto" step="0.01" min="0.01" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">N° Factura:</label>
                                <input type="text" id="eg_comprobante" class="form-control" placeholder="Opcional">
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-md-6 mb-2">
                                <button type="button" class="btn btn-secondary w-100 py-2" data-bs-dismiss="modal">Cancelar</button>
                            </div>
                            <div class="col-md-6">
                                <button type="button" class="btn btn-guardar rounded" onclick="guardarEgreso()">Guardar Egreso</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAR ELIMINACIÓN -->
    <div class="modal fade" id="modalEliminarEgreso" data-bs-backdrop="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-header text-white bg-danger">
                    <h5 class="modal-title fw-bold"><i class="fas fa-exclamation-triangle"></i> Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <h5 class="mb-3">¿Desea eliminar este registro?</h5>
                    <p class="text-muted small">El egreso será marcado como inactivo.</p>
                </div>
                <div class="modal-footer justify-content-center border-0 pb-4">
                    <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">No</button>
                    <button type="button" class="btn btn-danger px-4 fw-bold" onclick="confirmarEliminarEgreso()">Sí, eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="application/assets/js/bootstrap.bundle.min.js"></script>
    <script>
        let egresosLista = [];
        let idEgresoEliminar = null;

        document.addEventListener('DOMContentLoaded', () => {
            cargarEgresos();

            // Filtro combinado: texto + rango de fechas
            document.getElementById('buscadorEgresos').addEventListener('input', aplicarFiltrosEgresos);
            document.getElementById('fechaDesdeEgresos').addEventListener('change', aplicarFiltrosEgresos);
            document.getElementById('fechaHastaEgresos').addEventListener('change', aplicarFiltrosEgresos);
        });

        function aplicarFiltrosEgresos() {
            const term  = document.getElementById('buscadorEgresos').value.toLowerCase().trim();
            const desde = document.getElementById('fechaDesdeEgresos').value;
            const hasta = document.getElementById('fechaHastaEgresos').value;

            const filtrada = egresosLista.filter(e => {
                const texto = [e.descripcion, e.numero_comprobante, e.fecha]
                    .map(v => (v || '').toLowerCase()).join(' ');
                if (term && !texto.includes(term)) return false;

                const fechaReg = e.fecha || '';
                if (desde && fechaReg < desde) return false;
                if (hasta && fechaReg > hasta)  return false;

                return true;
            });

            renderTabla(filtrada, true);
        }

        function limpiarFiltrosEgresos() {
            document.getElementById('buscadorEgresos').value = '';
            document.getElementById('fechaDesdeEgresos').value = '';
            document.getElementById('fechaHastaEgresos').value = '';
            renderTabla(egresosLista, true);
        }

        function abrirModalEgreso(egresoJson) {
            document.getElementById('formEgreso').reset();
            const titulo = document.getElementById('tituloModal');
            
            if (egresoJson) {
                const e = JSON.parse(decodeURIComponent(egresoJson));
                document.getElementById('eg_id').value = e.id_egreso;
                document.getElementById('eg_fecha').value = e.fecha;
                document.getElementById('eg_descripcion').value = e.descripcion;
                document.getElementById('eg_monto').value = e.monto;
                document.getElementById('eg_comprobante').value = e.numero_comprobante || '';
                titulo.innerHTML = '<i class="fa-solid fa-edit"></i> Editar Egreso';
            } else {
                document.getElementById('eg_id').value = '';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('eg_fecha').value = today;
                titulo.innerHTML = '<i class="fa-solid fa-wallet"></i> Registrar Nuevo Egreso';
            }
            
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalAgregarEgreso')) 
                       || new bootstrap.Modal(document.getElementById('modalAgregarEgreso'));
            modal.show();
        }

        function cargarEgresos() {
            if ((!window.finanzasController)) {
                setTimeout(cargarEgresos, 150);
                return;
            }
            try {
                const json = window.finanzasController.obtenerEgresos();
                egresosLista = JSON.parse(json || '[]');
                renderTabla(egresosLista);
            } catch (e) {
                console.error('Error al cargar egresos', e);
            }
        }

        function renderTabla(lista, sinRefiltro) {
            const tbody = document.getElementById('tablaEgresosBody');
            if (!lista || lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay egresos activos registrados.</td></tr>';
                return;
            }
            
            let html = '';
            lista.forEach(e => {
                const montoFormateado = parseFloat(e.monto).toLocaleString('es-HN', { style: 'currency', currency: 'HNL' });
                const jsonStr = encodeURIComponent(JSON.stringify(e));
                html += `
                    <tr>
                        <td class="fw-bold"># ${e.id_egreso}</td>
                        <td>${e.fecha}</td>
                        <td>${e.descripcion}</td>
                        <td>${e.numero_comprobante || '-'}</td>
                        <td class="fw-bold text-danger">${montoFormateado}</td>
                        <td class="action-icons">
                            <i class="fas fa-edit" title="Editar" onclick="abrirModalEgreso('${jsonStr}')"></i>
                            <i class="fas fa-trash" title="Eliminar" onclick="borrarEgreso(${e.id_egreso})"></i>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            
            // Reaplicar filtros si hay criterios activos (y no venimos del propio filtro)
            if (!sinRefiltro) {
                const term  = document.getElementById('buscadorEgresos').value;
                const desde = document.getElementById('fechaDesdeEgresos').value;
                const hasta = document.getElementById('fechaHastaEgresos').value;
                if (term || desde || hasta) aplicarFiltrosEgresos();
            }
        }

        function guardarEgreso() {
            if ((!window.finanzasController)) { alert('Conector Java no encontrado.'); return; }
            
            const id = document.getElementById('eg_id').value;
            const fecha = document.getElementById('eg_fecha').value;
            const descripcion = document.getElementById('eg_descripcion').value.trim();
            const monto = document.getElementById('eg_monto').value;
            const comprobante = document.getElementById('eg_comprobante').value.trim();
            
            if (!fecha || !descripcion || !monto) {
                alert('Por favor complete los campos obligatorios (*).');
                return;
            }

            const data = {
                id_egreso: id ? parseInt(id) : null,
                fecha: fecha,
                descripcion: descripcion,
                monto: parseFloat(monto),
                numero_comprobante: comprobante
            };
            
            let respuesta = "";
            if (id) {
                respuesta = window.finanzasController.actualizarEgreso(JSON.stringify(data));
            } else {
                respuesta = window.finanzasController.registrarEgreso(JSON.stringify(data));
            }
            
            const partes = respuesta.split('|');
            alert(partes[1]);
            
            if (partes[0] === 'OK') {
                bootstrap.Modal.getInstance(document.getElementById('modalAgregarEgreso')).hide();
                cargarEgresos();
            }
        }
        
        function borrarEgreso(id) {
            idEgresoEliminar = id;
            const modal = bootstrap.Modal.getInstance(document.getElementById('modalEliminarEgreso')) 
                       || new bootstrap.Modal(document.getElementById('modalEliminarEgreso'));
            modal.show();
        }
        
        function confirmarEliminarEgreso() {
            if ((!window.finanzasController) || !idEgresoEliminar) return;
            const respuesta = window.finanzasController.inactivarEgreso(String(idEgresoEliminar));
            const partes = respuesta.split('|');
            alert(partes[1]);
            if (partes[0] === 'OK') {
                bootstrap.Modal.getInstance(document.getElementById('modalEliminarEgreso')).hide();
                cargarEgresos();
            }
        }
    </script>
</body>
</html>
