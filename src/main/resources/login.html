<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOE Odontología - Inicio de Sesión</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Asegúrate de tener tu imagen 'fondo-clinica.jpg' en la misma carpeta */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('fondo-clinica.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            width: 360px;
            text-align: center;
        }

        .login-container h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 11px;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .form-footer {
            margin-top: 20px;
            font-size: 13px;
        }

        .form-footer a {
            color: #3498db;
            text-decoration: none;
            cursor: pointer;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Ocultar secciones dinámicamente */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <!-- SECCIÓN 1: INICIO DE SESIÓN -->
        <div id="login-section">
            <h2>SOE Odontología</h2>
            <form onsubmit="event.preventDefault(); window.location.href='menu.html';">
                <div class="input-group">
                    <label for="usuario">Usuario o Correo</label>
                    <input type="text" id="usuario" required placeholder="Ingrese su usuario">
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Ingrese su contraseña">
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
            <div class="form-footer">
                <a onclick="mostrarRecuperacion()">¿Olvidaste tu contraseña?</a>
            </div>
        </div>

        <!-- SECCIÓN 2: RECUPERAR CONTRASEÑA -->
        <div id="recovery-section" class="hidden">
            <h2>Recuperar Cuenta</h2>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">
                Ingresa tu correo electrónico o número de teléfono registrado para enviarte las instrucciones.
            </p>
            <form onsubmit="event.preventDefault(); alert('Instrucciones enviadas con éxito.'); mostrarLogin();">
                <div class="input-group">
                    <label for="recovery-input">Correo o Teléfono</label>
                    <input type="text" id="recovery-input" required placeholder="ejemplo@correo.com o +504...">
                </div>
                <button type="submit" class="btn" style="background-color: #3498db;">Enviar Enlace</button>
            </form>
            <div class="form-footer">
                <a onclick="mostrarLogin()">Regresar al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script>
        function mostrarRecuperacion() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('recovery-section').classList.remove('hidden');
        }

        function mostrarLogin() {
            document.getElementById('recovery-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }
    </script>

</body>

</html>
