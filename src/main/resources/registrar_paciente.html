<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pacientes - SOE Odontología</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('fondo-clinica.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 20px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #007bf0;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
        }

        button:hover {
            background-color: #218838;
        }

        .section-title {
            background: #e9ecef;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 15px;
            color: #495057;
        }
    </style>
</head>

<body>

    <div class="container">
        <div style="margin-bottom: 15px;">
            <a href="menu.html" style="text-decoration: none; color: #007bf0; font-weight: bold; font-size: 14px;">
                ← Volver al Menú Principal
            </a>
        </div>
        <h2>Registro de Nuevo Paciente</h2>

        <!-- El formulario ya no usa un action de PHP, se preparó para conectarse con JavaScript/Java -->
        <form id="registroPacienteForm" onsubmit="registrarPaciente(event)">

            <div class="section-title">Datos Personales</div>

            <div class="row">
                <div class="col form-group">
                    <label for="identidad">DNI:</label>
                    <input type="text" id="identidad" name="identidad" placeholder="Ej: 0801-1990-12345" required>
                </div>
                <div class="col form-group">
                    <label for="nombre_completo">Nombre Completo:</label>
                    <input type="text" id="nombre_completo" name="nombreCompleto" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                    <input type="text" id="fecha_nacimiento" name="fechaNacimiento" placeholder="DD-MM-AAAA">
                </div>
                <div class="col form-group">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero">
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="ocupacion">Ocupación:</label>
                    <input type="text" id="ocupacion" name="ocupacion">
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" required>
                </div>
            </div>

            <div class="form-group">
                <label for="domicilio">Domicilio / Dirección:</label>
                <textarea id="domicilio" name="domicilio" rows="2"></textarea>
            </div>

            <div class="section-title">Persona Responsable en caso de emergencia o si es menor de edad</div>

            <div class="row">
                <div class="col form-group">
                    <label for="persona_responsable">Nombre del Responsable:</label>
                    <input type="text" id="persona_responsable" name="personaResponsable">
                </div>
                <div class="col form-group">
                    <label for="telefono_responsable">Teléfono del Responsable:</label>
                    <input type="text" id="telefono_responsable" name="telefonoResponsable">
                </div>
            </div>

            <button type="submit">Guardar Paciente</button>
        </form>
    </div>

    <script>
        function registrarPaciente(event) {
            event.preventDefault(); // Evitar que recargue la página
            
            // Recopilamos los datos del formulario
            const form = document.getElementById('registroPacienteForm');
            const formData = new FormData(form);
            const paciente = Object.fromEntries(formData.entries());
            
            // Convertimos a JSON
            const jsonStr = JSON.stringify(paciente);
            
            if (window.javaConnector) {
                // Llamamos a Java
                const respuesta = window.javaConnector.registrarPaciente(jsonStr);
                const partes = respuesta.split("|");
                alert(partes[1]);
                
                if (partes[0] === "OK") {
                    form.reset(); // Limpiar el formulario si se guardó bien
                }
            } else {
                alert("Error: El puente con Java no está inicializado.");
            }
        }

        // --- Funciones para autocompletar guiones ---
        
        function formatIdentidad(e) {
            let val = e.target.value.replace(/\D/g, ''); // Quita todo lo que no sea numero
            let newVal = '';
            if (val.length > 0) {
                newVal += val.substring(0, 4);
            }
            if (val.length >= 5) {
                newVal += '-' + val.substring(4, 8);
            }
            if (val.length >= 9) {
                newVal += '-' + val.substring(8, 13);
            }
            e.target.value = newVal;
        }

        function formatTelefono(e) {
            let val = e.target.value.replace(/\D/g, '');
            let newVal = '';
            if (val.length > 0) {
                newVal += val.substring(0, 4);
            }
            if (val.length >= 5) {
                newVal += '-' + val.substring(4, 8);
            }
            e.target.value = newVal;
        }

        function formatFecha(e) {
            let val = e.target.value.replace(/\D/g, ''); // Quita todo lo que no sea numero
            let newVal = '';
            if (val.length > 0) {
                newVal += val.substring(0, 2); // Dia
            }
            if (val.length >= 3) {
                newVal += '-' + val.substring(2, 4); // Mes
            }
            if (val.length >= 5) {
                newVal += '-' + val.substring(4, 8); // Año
            }
            e.target.value = newVal;
        }

        // Agregar los eventos a los inputs cuando cargue la pagina
        document.addEventListener('DOMContentLoaded', () => {
            const inputIdentidad = document.getElementById('identidad');
            const inputTelefono = document.getElementById('telefono');
            const inputTelefonoResp = document.getElementById('telefono_responsable');
            const inputFecha = document.getElementById('fecha_nacimiento');

            if (inputIdentidad) {
                inputIdentidad.addEventListener('input', formatIdentidad);
                inputIdentidad.maxLength = 15; // 13 numeros + 2 guiones
            }
            if (inputTelefono) {
                inputTelefono.addEventListener('input', formatTelefono);
                inputTelefono.maxLength = 9; // 8 numeros + 1 guion
            }
            if (inputTelefonoResp) {
                inputTelefonoResp.addEventListener('input', formatTelefono);
                inputTelefonoResp.maxLength = 9; 
            }
            if (inputFecha) {
                inputFecha.addEventListener('input', formatFecha);
                inputFecha.maxLength = 10; // DD-MM-AAAA (8 numeros + 2 guiones)
            }
        });
    </script>
</body>

</html>
